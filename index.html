<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apartment 3D walkthrough</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --ui: rgba(255,255,255,.9); --ui-text: #22262b; --ui-line: #cfd3d8; --accent: #1f6f78;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --ui: rgba(28,31,35,.9); --ui-text: #e8e6e0; --ui-line: #3b4148; --accent: #5fc0c9; }
}
:root[data-theme="dark"] { --ui: rgba(28,31,35,.9); --ui-text: #e8e6e0; --ui-line: #3b4148; --accent: #5fc0c9; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #cfe3f2; font: 14px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif; }
#view { position: absolute; inset: 0; touch-action: none; }
canvas { display: block; }
.bar {
  position: absolute; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); width: 212px; max-height: calc(100% - 190px); overflow-y: auto;
  display: flex; flex-direction: column; gap: 10px; padding: 10px; box-sizing: border-box;
  background: var(--ui); color: var(--ui-text); border: 1px solid var(--ui-line); border-radius: 12px; backdrop-filter: blur(8px);
}
.bar h3 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .65; }
.bar h4 { margin: 8px 0 4px; font-size: 13px; font-weight: 600; }
.bar .grp + .grp { border-top: 1px solid var(--ui-line); padding-top: 10px; }
.bar .row { display: flex; gap: 6px; flex-wrap: wrap; }
.bar .row.icons button { flex: 1; min-width: 0; padding: 7px 0; display: flex; align-items: center; justify-content: center; gap: 5px; }
.bar .row.icons span { font-size: 12px; font-weight: 600; }
button:disabled { opacity: .4; cursor: not-allowed; }
.bar .row.icons svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.bar .row:not(.icons) button { flex: 1 1 auto; padding: 6px 10px; font-size: 13px; }
.bar select { width: 100%; box-sizing: border-box; }
.bar label { display: block; font-size: 13px; margin-bottom: 4px; }
button, select {
  font: inherit; color: var(--ui-text); background: var(--ui); border: 1px solid var(--ui-line);
  border-radius: 8px; padding: 7px 12px; cursor: pointer; backdrop-filter: blur(6px);
}
button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint {
  position: absolute; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-width: min(480px, calc(100% - 24px));
  background: var(--ui); color: var(--ui-text); border: 1px solid var(--ui-line); border-radius: 8px; padding: 8px 12px; backdrop-filter: blur(6px);
}
#pad { position: absolute; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: none; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px); gap: 6px; }
#pad button { padding: 0; font-size: 20px; }
#pad .u { grid-column: 2; } 
#pad .l { grid-row: 2; grid-column: 1; } #pad .d { grid-row: 2; grid-column: 2; } #pad .r { grid-row: 2; grid-column: 3; }
.toast { position: absolute; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--ui); color: var(--ui-text); border: 1px solid var(--ui-line); border-radius: 8px; padding: 8px 14px; opacity: 0; transition: opacity .25s; pointer-events: none; backdrop-filter: blur(6px); white-space: nowrap; }
</style>
</head>
<body>
<div id="view"></div>
<div class="bar" role="toolbar" aria-label="Controls">
  <div class="grp">
    <h3>View</h3>
    <div class="row icons">
      <button id="bOrbit" aria-pressed="true" title="Orbit" aria-label="Orbit"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4h-4"/></svg></button>
      <button id="bWalk" aria-pressed="false" title="Walk" aria-label="Walk"><svg viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8"/><path d="M12 8.5l-2 5 3 2.5v5M10 13.5l-3 1.5M13 16l3.5 2M12 8.5l3 3 3 .8"/></svg></button>
      <button id="bTop" title="Top view" aria-label="Top view"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 12h9M13 4v8M13 16v4"/></svg></button>
      <button id="bCeil" aria-pressed="false" title="Ceiling" aria-label="Ceiling"><svg viewBox="0 0 24 24"><path d="M3 4h18M12 4v6M8 20l1.5-10h5L16 20z"/></svg></button>
    </div>
    <div style="margin-top:8px"><select id="rooms" aria-label="Jump to room"></select></div>
  </div>
  <div class="grp">
    <h3>Room layout</h3>
    <h4>Living room</h4>
    <div class="row icons seg" id="bLayout" role="group" aria-label="Living room layout">
      <button data-v="1" aria-pressed="true" title="Layout 1: divider mid-room" aria-label="Living room layout 1"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM10 10h10"/></svg><span>1</span></button>
      <button data-v="2" aria-pressed="false" title="Layout 2: divider by the entrance" aria-label="Living room layout 2"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 16h10"/></svg><span>2</span></button>
    </div>
    <h4>Small bedroom</h4>
    <div class="row icons seg" id="bLayoutBr" role="group" aria-label="Small bedroom layout">
      <button data-v="1" aria-pressed="true" title="Layout 1: queen bed" aria-label="Small bedroom layout 1"><svg viewBox="0 0 24 24"><path d="M3 19v-8h18v8M3 15h18M6 11V8h5v3"/></svg><span>1</span></button>
      <button data-v="2" aria-pressed="false" title="Layout 2: sofa bed" aria-label="Small bedroom layout 2"><svg viewBox="0 0 24 24"><path d="M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3M3 12a2 2 0 0 1 4 0v3h10v-3a2 2 0 0 1 4 0v5H3z"/></svg><span>2</span></button>
    </div>
  </div>
  <div class="grp">
    <h3>Furniture</h3>
    <h4>Dining table</h4>
    <div class="row icons">
      <button id="bTable" aria-pressed="true" title="Table open" aria-label="Dining table open"><svg viewBox="0 0 24 24"><path d="M2 9h20M5 9v9M19 9v9M9 13h6"/></svg></button>
      <button id="bFour" aria-pressed="false" title="4 people" aria-label="Seat 4 people"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="2"/><circle cx="16" cy="8" r="2"/><path d="M4 18c0-3 2-5 4-5s4 2 4 5M12 18c0-3 2-5 4-5s4 2 4 5"/></svg></button>
    </div>
    <h4>Sofa bed</h4>
    <div class="row icons">
      <button id="bBed" aria-pressed="false" title="Pull out the living-room sofa bed" aria-label="Living room sofa bed pulled out"><svg viewBox="0 0 24 24"><path d="M3 19v-8h18v8M3 15h18M6 11V8h5v3"/></svg></button>
      <button id="bBed2" aria-pressed="true" disabled title="Pull out the bedroom sofa bed (small bedroom Layout 2)" aria-label="Bedroom sofa bed pulled out"><svg viewBox="0 0 24 24"><path d="M3 19v-8h18v8M3 15h18M6 11V8h5v3"/><path d="M19 3v4M17 5h4"/></svg></button>
    </div>
    <h4>Coffee table</h4>
    <div class="row icons">
      <button id="bCoffee" aria-pressed="true" title="Stools out" aria-label="Coffee table stools out"><svg viewBox="0 0 24 24"><path d="M4 10h16M6 10v6M18 10v6M7 19h4M13 19h4"/></svg></button>
    </div>
  </div>
  <div class="grp">
    <h3>Time of day</h3>
    <div class="row icons seg" id="sTime" role="group" aria-label="Time of day">
      <button data-v="morning" aria-pressed="false" title="Morning: sun rises in the east, over the balcony" aria-label="Morning"><svg viewBox="0 0 24 24"><path d="M3 18h18M6 18a6 6 0 0 1 12 0M12 6v3M4.5 10.5l2 2M19.5 10.5l-2 2"/></svg></button>
      <button data-v="afternoon" aria-pressed="true" title="Afternoon: high sun" aria-label="Afternoon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg></button>
      <button data-v="evening" aria-pressed="false" title="Evening: sun sets in the west, through the entrance side" aria-label="Evening"><svg viewBox="0 0 24 24"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 11v-3M9.5 9.5L12 12l2.5-2.5M3 21h18"/></svg></button>
      <button data-v="night" aria-pressed="false" title="Night: moonlight and room lights" aria-label="Night"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/><path d="M17 4v3M15.5 5.5h3"/></svg></button>
    </div>
    <div style="font-size:11px;opacity:.65;margin-top:6px">Entrance faces west · Balcony faces east</div>
  </div>
  <div class="grp">
    <h3>Settings</h3>
    <div class="row icons seg" id="sTheme" role="group" aria-label="Theme">
      <button data-v="auto" aria-pressed="true" title="Theme: auto" aria-label="Theme auto"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
      <button data-v="light" aria-pressed="false" title="Theme: light" aria-label="Theme light"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg></button>
      <button data-v="dark" aria-pressed="false" title="Theme: dark" aria-label="Theme dark"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
    </div>
    <div class="row icons" style="margin-top:6px">
      <button id="sShadows" aria-pressed="true" title="Shadows" aria-label="Shadows"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><ellipse cx="12" cy="19" rx="7" ry="2"/></svg></button>
      <button id="sReset" title="Reset layouts to Layout 1" aria-label="Reset layouts"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4h4"/></svg></button>
    </div>
  </div>
</div>
<div class="hint" id="hint"></div>
<div class="toast" id="toast" role="status"></div>
<div id="pad">
  <button class="u" data-k="f" aria-label="Forward">▲</button>
  <button class="l" data-k="l" aria-label="Turn left">◀</button>
  <button class="d" data-k="b" aria-label="Back">▼</button>
  <button class="r" data-k="r" aria-label="Turn right">▶</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const S = 0.3048 / 17.3;                 // metres per plan pixel (17.3 px = 1 ft)
const WALL_H = 3.0, SILL = 0.9, WIN_TOP = 2.1, Z0 = 0.02;

// ---------------------------------------------------------------- renderer / scene
const host = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe3f2);
const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 200);

const hemi = new THREE.HemisphereLight(0xdcecff, 0x8a8678, 0.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 0.85);
sun.position.set(14, 20, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 80 });
sun.shadow.bias = -0.0006;
sun.target.position.set(5, 0, 6);
scene.add(sun, sun.target);

// ---------------------------------------------------------------- helpers
const world = new THREE.Group(); scene.add(world);
// the roof always exists: it keeps blocking the sun; the Ceiling button only decides whether you can see it
const ceilingGroup = new THREE.Group(); scene.add(ceilingGroup);
let ceilOn = false;
const colliders = [];                    // [x0, z0, x1, z1] in metres
let cur = world;                          // group that box() adds to by default
const cache = {};
function M(color, rough = 0.6, metal = 0) {
  const k = [color, rough, metal].join();
  return cache[k] || (cache[k] = new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal }));
}
const GLASS = new THREE.MeshPhysicalMaterial({ color: 0xcfe9f2, transparent: true, opacity: 0.28, roughness: 0.05, side: THREE.DoubleSide, depthWrite: false });

function box(x, y, w, h, z0, z1, mat, parent = cur, shadows = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w * S, z1 - z0, h * S), mat);
  m.position.set((x + w / 2) * S, (z0 + z1) / 2, (y + h / 2) * S);
  m.castShadow = shadows; m.receiveShadow = true;
  parent.add(m); return m;
}
function cyl(cx, cy, r, z0, z1, mat) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r * S, r * S, z1 - z0, 36), mat);
  m.position.set(cx * S, (z0 + z1) / 2, cy * S);
  m.castShadow = m.receiveShadow = true; world.add(m); return m;
}
function ellip(cx, cy, rx, ry, z, rz, mat) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 16), mat);
  m.scale.set(rx * S, rz, ry * S); m.position.set(cx * S, z, cy * S);
  m.castShadow = m.receiveShadow = true; world.add(m); return m;
}
const solid = (x, y, w, h) => colliders.push([x * S, y * S, (x + w) * S, (y + h) * S]);

// ---------------------------------------------------------------- procedural textures
function mk(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; t.encoding = THREE.sRGBEncoding; return t;
}
const texTile = (base, grout) => mk(256, 256, (g, w, h) => {
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1400; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.035})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  g.fillStyle = grout; g.fillRect(0, 0, w, 3); g.fillRect(0, 0, 3, h);
});
const texPlank = (cols, joint) => mk(512, 256, (g, w, h) => {
  const rows = 4, ph = h / rows;
  for (let r = 0; r < rows; r++) {
    const j = ((r * 0.41 + 0.12) % 1) * w;
    [[0, j], [j, w]].forEach(([a, b]) => {
      g.fillStyle = cols[Math.floor(Math.random() * cols.length)]; g.fillRect(a, r * ph, b - a, ph);
      for (let k = 0; k < 14; k++) { g.fillStyle = `rgba(0,0,0,${0.04 + Math.random() * 0.05})`; g.fillRect(a, r * ph + Math.random() * ph, b - a, 1); }
    });
    g.fillStyle = joint; g.fillRect(0, r * ph, w, 2); g.fillRect(j, r * ph, 2, ph);
  }
});
const TEX = {
  tile: texTile("#efe9d6", "#b9b3a3"),
  wet: texTile("#cdbd9a", "#8c8266"),
  util: texTile("#d9b9a1", "#9c8573"),
  wood: texPlank(["#6d4a33", "#5f402b", "#76533a"], "#1c1410"),
  deck: texPlank(["#8a5a42", "#7a4d38", "#946349"], "#2a1a12"),
};
function floor(x, y, w, h, thick, key, size, rough = 0.45) {
  const t = TEX[key].clone(); t.needsUpdate = true;
  t.repeat.set(w * S / size[0], h * S / size[1]);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w * S, thick, h * S), new THREE.MeshStandardMaterial({ map: t, roughness: rough }));
  m.position.set((x + w / 2) * S, thick / 2, (y + h / 2) * S); m.receiveShadow = true; world.add(m);
}

// ---------------------------------------------------------------- ground + floors
const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), M(0x8c9088, 0.95));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.16; ground.receiveShadow = true; world.add(ground);
box(30, 18, 560, 660, -0.15, 0, M(0x8d8f8a, 0.95));
floor(47, 35, 491, 372, 0.01, "tile", [0.6, 0.6], 0.3);
floor(374, 416, 164, 120, 0.01, "tile", [0.6, 0.6], 0.3);
floor(244, 95, 87, 130, 0.012, "wet", [0.3, 0.3], 0.25);
floor(47, 416, 222, 189, 0.012, "wood", [1.2, 0.6], 0.45);
floor(278, 450, 87, 155, 0.012, "wet", [0.3, 0.3], 0.25);
floor(487, 234, 88, 173, 0.015, "deck", [1.2, 0.6], 0.7);
floor(426, 545, 112, 60, 0.012, "util", [0.3, 0.3], 0.35);
box(374, 545, 42, 60, 0, 0.01, M(0x8d8f8a));
box(47, 345, 25, 60, 0, 0.12, M(0xb3b3b0, 0.3));
box(266, 35, 43, 51, 0, 0.03, M(0xb9b6b8, 0.5, 0.5));
box(316, 614, 109, 51, 0, 0.03, M(0xb9b6b8, 0.5, 0.5));

// ---------------------------------------------------------------- walls
const PAINT = M(0xf1ede4, 0.92), WHITE = M(0xffffff, 0.5), FRAME = M(0xd9dbdd, 0.35, 0.6);
const walls = [
  [38,26,52,9],[192,26,74,9],[310,26,64,9],[408,26,138,9],
  [38,26,9,217],[38,302,9,312],
  [538,26,9,55],[538,181,9,57],
  [391,225,189,9],
  [478,234,9,39],[478,367,9,40],[478,407,97,9],
  [236,26,9,208],[331,26,9,114],[331,183,9,51],[236,225,104,9],
  [236,86,32,9],[308,86,32,9],
  [38,407,181,9],[269,407,9,43],[269,492,9,122],
  [38,605,70,9],[209,605,114,9],
  [269,441,105,9],[365,407,9,207],
  [538,407,9,53],[538,493,9,121],
  [374,536,52,9],[416,536,9,78],[374,605,52,9],
  [506,536,32,9],[426,607,112,5],
  // fillers closing 1-3 px slivers between wall ends and window openings
  [90,26,1,9],[190,26,2,9],[407,26,1,9],[108,605,2,9],[206,605,3,9],
];
walls.forEach(([x, y, w, h], i) => {
  const e = 0.03 + 0.015 * (i % 7);   // tiny per-wall growth so overlapping walls never share coplanar faces
  box(x - e, y - e, w + 2 * e, h + 2 * e, -0.05 - 0.0007 * i, WALL_H - 0.0002 * i, PAINT);
  box(x - 0.9 - e, y - 0.9 - e, w + 1.8 + 2 * e, h + 1.8 + 2 * e, 0.0005 * (i % 5), 0.10 - 0.0003 * i, WHITE);
  solid(x, y, w, h);
});
box(574, 234, 1.5, 173, 0.1, 1.1, GLASS, world, false); box(573, 234, 3.5, 173, 1.1, 1.14, FRAME); box(573, 234, 3.5, 173, 0, 0.1, FRAME);
solid(573, 234, 4, 173);

// ---------------------------------------------------------------- windows
const FR = 2.6;
[
  [91,27,99,8],[374,27,33,8],[538,81,10,100],[268,85,40,10],
  [538,460,9,33],[474,536,32,9],[110,605,96,9],[323,605,41,9],
].forEach(([x, y, w, h]) => {
  box(x, y, w, h, 0, SILL, PAINT); box(x, y, w, h, WIN_TOP, WALL_H, PAINT);
  box(x - 0.8, y - 0.8, w + 1.6, h + 1.6, SILL - 0.03, SILL + 0.03, FRAME);
  box(x, y, w, h, WIN_TOP - 0.05, WIN_TOP, FRAME);
  if (w >= h) {
    box(x, y + h / 2 - 0.5, w, 1, SILL, WIN_TOP, GLASS, world, false);
    box(x, y, FR, h, SILL, WIN_TOP, FRAME); box(x + w - FR, y, FR, h, SILL, WIN_TOP, FRAME);
    if (w > 60) box(x + w / 2 - FR / 2, y, FR, h, SILL, WIN_TOP, FRAME);
  } else {
    box(x + w / 2 - 0.5, y, 1, h, SILL, WIN_TOP, GLASS, world, false);
    box(x, y, w, FR, SILL, WIN_TOP, FRAME); box(x, y + h - FR, w, FR, SILL, WIN_TOP, FRAME);
    if (h > 60) box(x, y + h / 2 - FR / 2, w, FR, SILL, WIN_TOP, FRAME);
  }
  solid(x, y, w, h);
});
// AC louver in top wall
box(266, 26, 44, 9, 0, 0.3, PAINT); box(266, 26, 44, 9, 2.7, WALL_H, PAINT);
for (let i = 0; i < 8; i++) box(266, 26, 44, 9, 0.35 + i * 0.3, 0.42 + i * 0.3, M(0xb9b6b8, 0.45, 0.6));
solid(266, 26, 44, 9);

// French doors to the balcony: full height, two glazed leaves, no wall below (walkable)
{
  const fx = 478, fy = 273, fw = 9, fh = 94, STEEL = M(0xb9bcc0, 0.3, 1);
  box(fx, fy, fw, fh, WIN_TOP, WALL_H, PAINT);
  box(fx - 0.5, fy, fw + 1, fh, WIN_TOP - 0.06, WIN_TOP, FRAME);
  box(fx - 1.5, fy, fw + 3, fh, 0, 0.03, FRAME);
  box(fx - 0.3, fy, fw + 0.6, FR, 0, WIN_TOP, FRAME);

}
const sTime = document.getElementById("sTime");
function setTime(n, instant) {
  if (!TIMES[n]) n = "afternoon";
  tod.name = n; sTime.value = n; todTo = todTarget(n);
  if (instant) { Object.assign(tod, todTarget(n)); applyTod(); }
}
bindSeg(sTime, n => { setTime(n); say({ morning: "Morning: sun rises in the east over the balcony", afternoon: "Afternoon: high sun", evening: "Evening: sun sets in the west, behind the entrance", night: "Night: moonlight and room lights" }[n]); });
(function initTime() {
  let n = null;
  try { const v = JSON.parse(localStorage.getItem("apartment3d.view")); n = v && v.time; } catch (e) {}
  if (!TIMES[n]) { const h = new Date().getHours(); n = h >= 5 && h < 11 ? "morning" : h < 16 ? "afternoon" : h < 19 ? "evening" : "night"; }
  setTime(n, true);
})();

// keep the current view across page reloads
const VIEW_KEY = "apartment3d.view";
function saveView() {
  try {
    localStorage.setItem(VIEW_KEY, JSON.stringify({
      mode, time: tod.name, ceil: ceilOn,
      cam: camera.position.toArray(), tgt: orbit.target.toArray(),
      walk: { x: walk.x, z: walk.z, yaw: walk.yaw, pitch: walk.pitch }
    }));
  } catch (e) {}
}
setInterval(saveView, 500);
addEventListener("pagehide", saveView);
(function restoreView() {
  let v = null;
  try { v = JSON.parse(localStorage.getItem(VIEW_KEY)); } catch (e) {}
  if (!v || !Array.isArray(v.cam) || !Array.isArray(v.tgt)) { setMode("orbit"); return; }
  if (v.mode === "walk" && v.walk) {
    Object.assign(walk, v.walk); if (![walk.x, walk.z, walk.yaw, walk.pitch].every(Number.isFinite) || blocked(walk.x, walk.z)) place(0);
    setMode("walk");
    if (!v.ceil) setCeiling(false);
  } else {
    setMode("orbit");
    camera.position.fromArray(v.cam); orbit.target.fromArray(v.tgt); orbit.update();
  }
})();
</script>
<script>
// dev live-reload: when served over http(s), reload the page whenever this file changes (the saved view is restored)
if (location.protocol.startsWith("http")) {
  let last = null;
  setInterval(() => fetch(location.pathname, { method: "HEAD", cache: "no-store" }).then(r => {
    const m = r.headers.get("last-modified"); if (last && m && m !== last) location.reload(); last = m || last;
  }).catch(() => {}), 1000);
}
</script>
